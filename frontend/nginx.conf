server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker. Sin esto, nginx resuelve "backend" una sola vez al
    # arrancar y fija esa IP; si el contenedor backend reinicia y cambia de IP,
    # nginx queda apuntando a una IP muerta y devuelve 502 en todo /api/.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Usar una variable fuerza a nginx a re-resolver el DNS en runtime (cada valid=10s)
        # en lugar de fijar la IP al arrancar.
        set $backend_upstream backend;
        proxy_pass         http://$backend_upstream:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
