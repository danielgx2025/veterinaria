services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgressql-server-ghxxy3
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: veterinaria
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - dokploy-network
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Enrutamiento único para el Backend
      - traefik.http.routers.veterinaria-backend.rule=Host(`veterinaria-bowhru-c0c7e0-149-50-139-62.sslip.io`)
      - traefik.http.routers.veterinaria-backend.entrypoints=web
      - traefik.http.services.veterinaria-backend.loadbalancer.server.port=3001


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    # Quitamos la sección 'ports' expuesta para que no choque con Traefik
    networks:
      - dokploy-network
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Enrutamiento único para el Frontend
      - traefik.http.routers.veterinaria-frontend.rule=Host(`veterinaria-bowhru-45e140-149-50-139-62.sslip.io`)
      - traefik.http.routers.veterinaria-frontend.entrypoints=web
      # Ajustamos el puerto interno: Dejalo en 80 si tu Dockerfile usa Nginx para producción, 
      # o cambialo a 5173 si levanta un servidor de Node directo.
      - traefik.http.services.veterinaria-frontend.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true